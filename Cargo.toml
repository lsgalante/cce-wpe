[package]
name = "cce-wpe"
version = "0.1.0"
edition = "2021"
description = "WPE WebKit embedded in a cce-ui app: the bindings, the WPEPlatform subclasses, the GLib-on-calloop source, input translation, frame damage and the page input-method context"
license = "GPL-3.0"

[dependencies]
# input.rs translates cce-ui's key and mouse events into WPEEvents.
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "8778d0a3f6840b8b3dc1050d89be4cedf6ac95e4" }
# GLib's changing pollfd set, held in one epoll fd (glib_source.rs).
rustix = { version = "0.38", features = ["event"] }
log = "0.4"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
